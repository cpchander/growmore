      <stop offset="0" stop-color="#060E1A"/>
      <stop offset="1" stop-color="#0C1A2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A843"/>
      <stop offset="1" stop-color="#F0CE7A"/>
