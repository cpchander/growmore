<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#060E1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0C75E"/>
      <stop offset="1" stop-color="#D4A843"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- estate boundary -->
  <rect x="70" y="120" width="1060" height="430" rx="14" fill="none" stroke="#D4A843" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.55"/>
  <!-- corner perimeter nodes -->
  <g fill="#D4A843">
    <circle cx="70" cy="120" r="7"/><circle cx="1130" cy="120" r="7"/>
    <circle cx="70" cy="550" r="7"/><circle cx="1130" cy="550" r="7"/>
    <circle cx="600" cy="120" r="6" opacity="0.8"/><circle cx="600" cy="550" r="6" opacity="0.8"/>
    <circle cx="70" cy="335" r="6" opacity="0.8"/><circle cx="1130" cy="335" r="6" opacity="0.8"/>
  </g>

  <!-- main house -->
  <rect x="500" y="300" width="200" height="150" rx="8" fill="#13243D" stroke="#3B82F6" stroke-width="2"/>
  <rect x="540" y="270" width="120" height="40" fill="#13243D" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="382" text-anchor="middle" fill="#9FB3C8" font-family="Arial, sans-serif" font-size="18" font-weight="600">Main House</text>
  <text x="600" y="405" text-anchor="middle" fill="#6B8299" font-family="Arial, sans-serif" font-size="13">KNX backbone</text>

  <!-- gate -->
  <rect x="560" y="540" width="80" height="20" rx="4" fill="url(#gold)"/>
  <text x="600" y="586" text-anchor="middle" fill="#9FB3C8" font-family="Arial, sans-serif" font-size="13">Auto Gate</text>

  <!-- subsystem chips -->
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="120" y="180" width="170" height="56" rx="10" fill="#0F1D33" stroke="#D4A843" stroke-width="1.3"/>
      <text x="205" y="205" text-anchor="middle" fill="#F0C75E" font-size="15" font-weight="700">Perimeter</text>
      <text x="205" y="224" text-anchor="middle" fill="#7E93AA" font-size="12">₹4–10 L</text>
    </g>
    <g>
      <rect x="910" y="180" width="170" height="56" rx="10" fill="#0F1D33" stroke="#D4A843" stroke-width="1.3"/>
      <text x="995" y="205" text-anchor="middle" fill="#F0C75E" font-size="15" font-weight="700">Networking</text>
      <text x="995" y="224" text-anchor="middle" fill="#7E93AA" font-size="12">₹2.5–7 L</text>
    </g>
    <g>
      <rect x="120" y="430" width="170" height="56" rx="10" fill="#0F1D33" stroke="#D4A843" stroke-width="1.3"/>
      <text x="205" y="455" text-anchor="middle" fill="#F0C75E" font-size="15" font-weight="700">Solar + Backup</text>
      <text x="205" y="474" text-anchor="middle" fill="#7E93AA" font-size="12">₹4–12 L</text>
    </g>
    <g>
      <rect x="910" y="430" width="170" height="56" rx="10" fill="#0F1D33" stroke="#D4A843" stroke-width="1.3"/>
      <text x="995" y="455" text-anchor="middle" fill="#F0C75E" font-size="15" font-weight="700">Landscape</text>
      <text x="995" y="474" text-anchor="middle" fill="#7E93AA" font-size="12">₹3–9 L</text>
    </g>
  </g>

  <!-- connecting lines from house to chips -->
  <g stroke="#3B82F6" stroke-width="1.4" opacity="0.45">
    <line x1="500" y1="360" x2="290" y2="208"/>
    <line x1="700" y1="360" x2="910" y2="208"/>
    <line x1="500" y1="420" x2="290" y2="458"/>
    <line x1="700" y1="420" x2="910" y2="458"/>
  </g>

  <!-- title -->
  <text x="70" y="62" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" font-weight="800">Farmhouse Home Automation in India</text>
  <text x="70" y="98" fill="#D4A843" font-family="Arial, sans-serif" font-size="22" font-weight="600">2026 · ₹15–60 Lakh+ · 6BHK NCR avg ₹38 Lakh</text>

  <!-- footer -->
  <text x="600" y="615" text-anchor="middle" fill="#56708C" font-family="Arial, sans-serif" font-size="13">60–70% of the budget is land, not the building · Based on 600+ GMHS installations</text>
</svg>
