    <rect x="800" y="330" width="320" height="180" rx="16" fill="#0F2138" stroke="#D4A843" stroke-width="2"/>
    <text x="830" y="375" font-size="24" fill="#9FB4CC" font-weight="600">Luxury KNX / Crestron</text>
