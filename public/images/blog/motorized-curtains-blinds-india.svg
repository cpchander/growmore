<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="100%" stop-color="#0B1626"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8862F"/>
      <stop offset="50%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#F5D478"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2744" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1A2E" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4A843" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Header -->
  <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#D4A843" letter-spacing="3">GMHS · 2026 GUIDE</text>
  <text x="60" y="140" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">Motorized Curtains &amp; Blinds in India</text>
  <text x="60" y="180" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">₹8,000 – ₹2.4 Lakh+ per window · 300+ installations</text>

  <!-- Window with motorized curtains illustration on right -->
  <g transform="translate(820, 70)">
    <!-- window frame -->
    <rect x="0" y="0" width="320" height="280" fill="none" stroke="#D4A843" stroke-width="2" rx="4"/>
    <!-- sky -->
    <rect x="6" y="6" width="308" height="268" fill="#1E3A5F" opacity="0.6"/>
    <!-- sun -->
    <circle cx="240" cy="80" r="28" fill="url(#gold)" opacity="0.7"/>
    <!-- mullions -->
    <line x1="160" y1="6" x2="160" y2="274" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
    <line x1="6" y1="140" x2="314" y2="140" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
    <!-- curtain rod / track -->
    <rect x="-20" y="-12" width="360" height="14" fill="#D4A843" rx="2"/>
    <!-- left curtain panel -->
    <path d="M -10 0 Q 30 60 25 280 L 90 280 Q 95 100 100 0 Z" fill="url(#fabric)" stroke="#D4A843" stroke-width="1.5" opacity="0.85"/>
    <!-- right curtain panel -->
    <path d="M 330 0 Q 290 60 295 280 L 230 280 Q 225 100 220 0 Z" fill="url(#fabric)" stroke="#D4A843" stroke-width="1.5" opacity="0.85"/>
    <!-- motor symbol -->
    <circle cx="340" cy="-5" r="10" fill="#0B1626" stroke="#D4A843" stroke-width="2"/>
    <text x="340" y="-1" text-anchor="middle" font-family="monospace" font-size="10" fill="#D4A843" font-weight="700">M</text>
  </g>

  <!-- Pricing tier bars -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#D4A843">PRICING BY TIER (per window, installed)</text>

    <g transform="translate(0, 30)">
      <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Basic Wi-Fi roller</text>
      <rect x="220" y="6" width="80" height="20" fill="url(#gold)" opacity="0.4"/>
      <text x="310" y="22" font-family="monospace" font-size="13" fill="#94A3B8">₹8K – ₹18K</text>
    </g>

    <g transform="translate(0, 65)">
      <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Somfy RTS / Acmeda</text>
      <rect x="220" y="6" width="140" height="20" fill="url(#gold)" opacity="0.55"/>
      <text x="370" y="22" font-family="monospace" font-size="13" fill="#94A3B8">₹18K – ₹42K</text>
    </g>

    <g transform="translate(0, 100)">
      <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">KNX-integrated wired</text>
      <rect x="220" y="6" width="220" height="20" fill="url(#gold)" opacity="0.7"/>
      <text x="450" y="22" font-family="monospace" font-size="13" fill="#94A3B8">₹38K – ₹85K</text>
    </g>

    <g transform="translate(0, 135)">
      <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Dual-layer sheer + blackout</text>
      <rect x="220" y="6" width="320" height="20" fill="url(#gold)" opacity="0.85"/>
      <text x="550" y="22" font-family="monospace" font-size="13" fill="#94A3B8">₹70K – ₹1.6 Lakh</text>
    </g>

    <g transform="translate(0, 170)">
      <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Lutron Sivoia QS / Crestron</text>
      <rect x="220" y="6" width="450" height="20" fill="url(#gold)"/>
      <text x="680" y="22" font-family="monospace" font-size="13" fill="#94A3B8">₹1.2 L – ₹2.4 L+</text>
    </g>
  </g>

  <!-- Energy savings callout -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="340" height="100" fill="none" stroke="#D4A843" stroke-width="1.5" rx="6"/>
    <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D4A843" font-weight="600">HVAC LOAD SAVINGS</text>
    <text x="20" y="74" font-family="Inter, system-ui, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700">14 – 22%</text>
    <text x="170" y="74" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">integrated solar +</text>
    <text x="170" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">occupancy logic</text>
  </g>

  <g transform="translate(420, 470)">
    <rect x="0" y="0" width="340" height="100" fill="none" stroke="#D4A843" stroke-width="1.5" rx="6"/>
    <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#D4A843" font-weight="600">PEAK SOLAR LOAD AVOIDED</text>
    <text x="20" y="74" font-family="Inter, system-ui, sans-serif" font-size="38" fill="#FFFFFF" font-weight="700">1.5 – 2.2 kW</text>
    <text x="200" y="74" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">per 8×6 ft south-</text>
    <text x="200" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">facing window</text>
  </g>

  <!-- Footer -->
  <text x="60" y="610" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">growmoresolutions.com — 300+ installations | 12 cities | 15+ years</text>
  <text x="1140" y="610" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#D4A843" font-weight="600">KNX-certified · Anupam Mahajan, MD</text>
</svg>
