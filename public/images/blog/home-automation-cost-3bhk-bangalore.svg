    <text x="110" y="430" font-size="42" fill="url(#gold)" font-weight="800">₹1.5–4 L</text>
    <text x="110" y="475" font-size="20" fill="#7E93AD">Ready-to-move flats</text>

    <rect x="440" y="330" width="320" height="180" rx="16" fill="#0F2138" stroke="#1A2744" stroke-width="2"/>
