  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>

  <text x="80" y="120" font-family="Geist, Arial, sans-serif" font-size="30" fill="#7FA8D9" font-weight="600" letter-spacing="2">GROW MORE SOLUTIONS · BANGALORE · 2026</text>
  <text x="80" y="190" font-family="Geist, Arial, sans-serif" font-size="58" fill="#FFFFFF" font-weight="800">Home Automation Cost</text>
  <text x="80" y="258" font-family="Geist, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#gold)">for a 3BHK in Bangalore</text>

  <!-- Tier cards -->
